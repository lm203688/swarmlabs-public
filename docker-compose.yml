version: '3.8'

services:
  swarmlabs-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swarmlabs-main
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal:11434}
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json; json.load(open('/app/data/trust_surface.json'))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
