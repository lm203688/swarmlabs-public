name := "svp_invariants"

version := "0.5.0"

-- Mathlib is a heavy dependency; pin both Lean and Mathlib to the same
-- published toolchain rev for reproducibility.
require mathlib from git
  "https://github.com/leanprover-community/mathlib4"
  with { rev := "v4.34.1" }

leanOptions := [
  { warnUnpackedBinder := false },
  { autoImplicit := false }
]

[[lean_lib]]
name := "svp_invariants"
roots := ["Invariants"]
