<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SwarmLabs API — Swagger UI</title>
<meta name="description" content="Interactive API documentation for SwarmLabs — math-backed verification for AI science">
<meta property="og:title" content="SwarmLabs API Documentation">
<meta property="og:description" content="OpenAPI 3.0 interactive documentation — 64 endpoints, fail-closed verification gate">
<meta property="og:type" content="website">
<link rel="canonical" href="https://swarmlabs.tools/swagger-ui">
<link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; }
  #top { background: #1a1a2e; color: #e0e0e0; padding: 16px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  #top h1 { margin: 0; font-size: 18px; font-weight: 600; }
  #top .ver { font-size: 12px; opacity: 0.7; }
  #top .links { margin-left: auto; display: flex; gap: 12px; }
  #top .links a { color: #6c63ff; text-decoration: none; font-size: 13px; }
  #top .links a:hover { text-decoration: underline; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge-pass { background: #d4edda; color: #155724; }
  .badge-info { background: #d1ecf1; color: #0c5460; }
  #swagger-ui .topbar { display: none; }
  #swagger-ui .download-url-wrapper { display: none; }
  .swagger-ui .info h2 { color: #1a1a2e; }
</style>
</head>
<body>
<div id="top">
  <div>
    <h1>SwarmLabs API v3</h1>
    <span class="ver">OpenAPI 3.0.3 · 64 endpoints · <span class="badge badge-pass">91 PASS</span> <span class="badge badge-info">1 REFUTED</span></span>
  </div>
  <div class="links">
    <a href="https://swarmlabs.tools">Home</a>
    <a href="https://swarmlabs.tools/lab">Lab</a>
    <a href="https://swarmlabs.tools/openapi.json">OpenAPI JSON</a>
    <a href="https://swarmlabs.tools/reports/gate_ledger.json">Gate Ledger</a>
  </div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  const ui = SwaggerUIBundle({
    url: '/openapi.json',
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.plugins.DownloadUrl],
    layout: 'StandaloneLayout',
    filter: ['all'],
    validatorUrl: null,
    requestInterceptor: function(request) {
      // 可选：注入 API key（用户从 UI 输入）
      const apiKey = localStorage.getItem('swarmlabs_api_key');
      if (apiKey) {
        request.headers = request.headers || {};
        request.headers['x-api-key'] = apiKey;
      }
      return request;
    }
  });
  // 简单 API Key 输入框
  const keyDiv = document.createElement('div');
  keyDiv.style.cssText = 'position:fixed;top:8px;right:8px;z-index:1000;display:flex;gap:8px;align-items:center;background:#fff;padding:8px;border:1px solid #ddd;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.1);font-size:12px;';
  keyDiv.innerHTML = '<label>API Key: </label><input type="password" id="api_key_input" placeholder="gtk_..." style="width:200px;padding:4px 8px;border:1px solid #ccc;border-radius:4px;font-size:12px;"><button id="save_key" style="padding:4px 12px;background:#6c63ff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:12px;">Save</button>';
  document.body.appendChild(keyDiv);
  document.getElementById('save_key').onclick = () => {
    const v = document.getElementById('api_key_input').value.trim();
    if (v) { localStorage.setItem('swarmlabs_api_key', v); keyDiv.style.borderColor = '#28a745'; setTimeout(() => keyDiv.style.borderColor = '#ddd', 2000); }
  };
  const saved = localStorage.getItem('swarmlabs_api_key');
  if (saved) document.getElementById('api_key_input').value = saved;
</script>
</body>
</html>
